  <header class="bar" role="banner">

    <span class="bar__sep" aria-hidden="true">::</span>
    <span class="bar__path" id="bar-path">~</span>
    <span class="bar__spacer"></span>
    <span class="bar__meta" id="bar-clock" aria-hidden="true"></span>
    <span class="bar__dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </header>

  <nav class="pane pane--nav" aria-label="Sections">

      <p class="nav__group">~/projects</p>
      <ul class="nav__list" id="nav-projects"></ul>
      <p class="nav__group">~</p>

        <li><button class="ent" data-cmd="clear">clear</button></li>
      </ul>
    </div>
  </nav>

  <main class="pane pane--main">
    <h2 class="pane__title">main</h2>
    <div class="pane__body out-scroll" id="out" role="log" aria-live="polite" aria-label="Command output"></div>

    <div class="pane__body">
      <div class="stats" id="stats"></div>
      <div class="stream" id="stream"></div>
    </div>
  </aside>

  <form class="prompt" id="prompt-form">
    <label class="prompt__ps1" for="prompt" id="ps1">shray@soorma:~$</label>
    <input class="prompt__input" id="prompt" name="prompt" type="text"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-describedby="prompt-hint">
    <span class="prompt__caret" aria-hidden="true"></span>
    <span class="sr-only" id="prompt-hint">Type a command such as help, ls, or cat charlore. Use the up arrow for history and tab to complete.</span>
